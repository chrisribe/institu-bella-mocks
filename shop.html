<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boutique — Bella par Chloé</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --rose:        #4fada8;
      --rose-light:  #7ececa;
      --rose-pale:   #e0f4f3;
      --rose-hover:  #3d9490;
      --plum:        #2a5c58;
      --sand:        #f5f0e6;
      --cream:       #fdfaf5;
      --ink:         #162e2c;
      --ink-soft:    #3d6260;
      --muted:       #7aa4a2;
      --divider:     #d4ecea;
      --on-rose:     #ffffff;

      --font-display: 'Playfair Display', Georgia, serif;
      --font-body:    'DM Sans', system-ui, sans-serif;
      --radius-sm:    8px;
      --radius-md:    16px;
      --radius-pill:  999px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font-body); background: var(--cream); color: var(--ink); line-height: 1.6; }
    a { text-decoration: none; color: inherit; }
    .container { max-width: 1180px; margin: 0 auto; padding: 0 32px; }

    header.shop-header {
      background: var(--plum);
      color: #fff;
      padding: 22px 0;
    }
    .shop-header .container { display: flex; align-items: center; justify-content: space-between; }
    .shop-logo { font-family: var(--font-display); font-size: 20px; }
    .shop-logo em { font-style: italic; color: var(--rose-light); }
    .back-link {
      font-size: 13px;
      color: rgba(255,255,255,0.85);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .back-link:hover { color: #fff; }

    .shop-hero {
      text-align: center;
      padding: 56px 0 24px;
    }
    .shop-hero h4 {
      font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      color: var(--rose); margin-bottom: 10px;
    }
    .shop-hero h1 {
      font-family: var(--font-display); font-size: clamp(28px, 4vw, 40px); font-weight: 500; margin-bottom: 12px;
    }
    .shop-hero p { color: var(--ink-soft); max-width: 520px; margin: 0 auto; }

    main { padding: 24px 0 96px; }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-top: 24px;
    }
    @media (max-width: 900px) { .products-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 560px) { .products-grid { grid-template-columns: 1fr; } }

    .product-card {
      background: var(--sand);
      border-radius: var(--radius-md);
      overflow: hidden;
      transition: transform 0.3s, box-shadow 0.3s;
      cursor: pointer;
    }
    .product-card:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(74,45,53,0.1); }
    .product-img { aspect-ratio: 1; overflow: hidden; background: var(--divider); }
    .product-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s; }
    .product-card:hover .product-img img { transform: scale(1.04); }
    .product-body { padding: 16px 18px 20px; }
    .product-name { font-size: 15px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
    .product-desc { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 14px; }
    .product-footer { display: flex; align-items: center; justify-content: space-between; }
    .product-price { font-family: var(--font-body); font-weight: 600; font-size: 17px; color: var(--ink); letter-spacing: 0.2px; }
    .product-new {
      font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
      color: var(--rose); border: 1px solid var(--rose); padding: 3px 10px; border-radius: var(--radius-pill);
    }

    .products-state { grid-column: 1 / -1; color: var(--muted); font-size: 14px; padding: 60px 0; text-align: center; }

    .load-more-wrap { text-align: center; margin-top: 40px; }
    .btn {
      display: inline-block; padding: 14px 32px; border-radius: var(--radius-pill);
      font-size: 14px; font-weight: 600; transition: all 0.25s; cursor: pointer; border: none;
    }
    .btn-outline { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }
    .btn-outline:hover { background: var(--ink); color: #fff; }
    .btn-rose { background: var(--rose); color: var(--on-rose); }
    .btn-rose:hover { background: var(--rose-hover); }

    /* PDP overlay */
    .pdp-overlay {
      position: fixed; inset: 0; background: rgba(22,46,44,0.55);
      display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 100;
    }
    .pdp-overlay[hidden] { display: none; }
    .pdp-card {
      background: var(--cream); border-radius: var(--radius-md); max-width: 780px; width: 100%;
      max-height: 90vh; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr;
    }
    @media (max-width: 640px) { .pdp-card { grid-template-columns: 1fr; } }
    .pdp-img { aspect-ratio: 1; background: var(--divider); }
    .pdp-img img { width: 100%; height: 100%; object-fit: cover; }
    .pdp-body { padding: 32px; position: relative; }
    .pdp-close {
      position: absolute; top: 16px; right: 16px; background: none; border: none;
      font-size: 22px; color: var(--muted); cursor: pointer; line-height: 1;
    }
    .pdp-name { font-family: var(--font-display); font-size: 24px; margin-bottom: 8px; }
    .pdp-price { font-family: var(--font-body); font-weight: 700; font-size: 19px; color: var(--rose); margin-bottom: 16px; }
    .pdp-desc { font-size: 14px; color: var(--ink-soft); line-height: 1.7; margin-bottom: 24px; }
    .pdp-desc p { margin-bottom: 10px; }
    .pdp-stock { font-size: 13px; margin-bottom: 20px; }
    .pdp-stock.in { color: var(--rose); }
    .pdp-stock.out { color: #b0554f; }

    footer.shop-footer {
      background: var(--plum); color: rgba(255,255,255,0.75);
      text-align: center; padding: 32px 0; font-size: 13px;
    }
  </style>
</head>
<body>

  <header class="shop-header">
    <div class="container">
      <a href="index.html" class="shop-logo">Bella <em>par Chloé</em></a>
      <a href="index.html#boutique" class="back-link">← Retour au site</a>
    </div>
  </header>

  <section class="shop-hero">
    <div class="container">
      <h4>Ma sélection</h4>
      <h1>Toute la boutique</h1>
      <p>Des produits professionnels que j'utilise moi-même et que je recommande avec conviction — pour prolonger vos soins à la maison.</p>
    </div>
  </section>

  <main>
    <div class="container">
      <div class="products-grid" id="products-grid">
        <p class="products-state" id="products-state">Chargement des produits…</p>
      </div>
      <div class="load-more-wrap">
        <button class="btn btn-outline" id="load-more" hidden>Charger plus</button>
      </div>
    </div>
  </main>

  <footer class="shop-footer">
    <div class="container">© Institut Bella par Chloé — Chambly, QC</div>
  </footer>

  <!-- PDP overlay -->
  <div class="pdp-overlay" id="pdp-overlay" hidden>
    <div class="pdp-card" id="pdp-card"></div>
  </div>

  <script type="module">
    import { queryProducts, getProductBySlug } from './js/wix/wix-store-catalog.js';
    import { escapeHtml, stripTags, formatPrice, wixImg } from './js/site-helpers.js';

    const grid = document.getElementById('products-grid');
    const state = document.getElementById('products-state');
    const loadMoreBtn = document.getElementById('load-more');
    const overlay = document.getElementById('pdp-overlay');
    const pdpCard = document.getElementById('pdp-card');

    let nextCursor = null;
    let loading = false;

    function cardHtml(p) {
      const name = escapeHtml(p.name);
      const price = escapeHtml(formatPrice(p.actualPriceRange?.minValue?.formattedAmount ?? ''));
      const img = wixImg(p.media?.main?.image?.url, 400);
      const imgAlt = escapeHtml(p.media?.main?.image?.altText || p.name || '');
      const desc = escapeHtml(stripTags(p.plainDescription).slice(0, 80));
      const soldOut = p.inventory?.availabilityStatus === 'OUT_OF_STOCK';
      return `
        <div class="product-card" data-slug="${escapeHtml(p.slug)}">
          <div class="product-img">${img ? `<img src="${escapeHtml(img)}" alt="${imgAlt}" loading="lazy">` : ''}</div>
          <div class="product-body">
            <div class="product-name">${name}</div>
            ${desc ? `<div class="product-desc">${desc}</div>` : ''}
            <div class="product-footer">
              <span class="product-price">${price}</span>
              ${soldOut ? '<span class="product-new">Épuisé</span>' : ''}
            </div>
          </div>
        </div>`;
    }

    async function loadPage() {
      if (loading) return;
      loading = true;
      loadMoreBtn.disabled = true;
      try {
        const { products, nextCursor: cursor } = await queryProducts({ limit: 12, cursor: nextCursor ?? undefined });
        if (state) { state.remove(); }
        if (!products.length && !grid.children.length) {
          grid.innerHTML = '<p class="products-state">La boutique sera bientôt disponible.</p>';
          return;
        }
        grid.insertAdjacentHTML('beforeend', products.map(cardHtml).join(''));
        nextCursor = cursor;
        loadMoreBtn.hidden = !cursor;
      } catch (err) {
        console.error('Boutique load failed:', err);
        if (!grid.children.length) grid.innerHTML = '<p class="products-state">Impossible de charger la boutique pour le moment.</p>';
      } finally {
        loading = false;
        loadMoreBtn.disabled = false;
      }
    }

    async function openPdp(slug) {
      overlay.hidden = false;
      pdpCard.innerHTML = '<div class="pdp-body">Chargement…</div>';
      try {
        const product = await getProductBySlug(slug);
        if (!product) {
          pdpCard.innerHTML = '<div class="pdp-body">Produit introuvable.<button class="pdp-close" id="pdp-close">×</button></div>';
          document.getElementById('pdp-close').addEventListener('click', closePdp);
          return;
        }
        const img = wixImg(product.media?.main?.image?.url, 700);
        const imgAlt = escapeHtml(product.media?.main?.image?.altText || product.name || '');
        const price = escapeHtml(formatPrice(product.actualPriceRange?.minValue?.formattedAmount ?? ''));
        const inStock = product.inventory?.availabilityStatus !== 'OUT_OF_STOCK';
        pdpCard.innerHTML = `
          <div class="pdp-img">${img ? `<img src="${escapeHtml(img)}" alt="${imgAlt}">` : ''}</div>
          <div class="pdp-body">
            <button class="pdp-close" id="pdp-close" aria-label="Fermer">×</button>
            <div class="pdp-name">${escapeHtml(product.name)}</div>
            <div class="pdp-price">${price}</div>
            <div class="pdp-stock ${inStock ? 'in' : 'out'}">${inStock ? 'En stock' : 'Épuisé'}</div>
            <div class="pdp-desc">${product.plainDescription || ''}</div>
            <a href="index.html#booking" class="btn btn-rose">Me contacter pour commander</a>
          </div>`;
        document.getElementById('pdp-close').addEventListener('click', closePdp);
      } catch (err) {
        console.error('Product detail load failed:', err);
        pdpCard.innerHTML = '<div class="pdp-body">Impossible de charger ce produit.<button class="pdp-close" id="pdp-close">×</button></div>';
        document.getElementById('pdp-close').addEventListener('click', closePdp);
      }
    }

    function closePdp() {
      overlay.hidden = true;
      pdpCard.innerHTML = '';
    }

    grid.addEventListener('click', (e) => {
      const card = e.target.closest('.product-card');
      if (card?.dataset.slug) openPdp(card.dataset.slug);
    });
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closePdp(); });
    loadMoreBtn.addEventListener('click', loadPage);

    loadPage();

    // Deep link: shop.html?product=<slug> auto-opens that product's detail overlay.
    const requestedSlug = new URLSearchParams(location.search).get('product');
    if (requestedSlug) openPdp(requestedSlug);
  </script>

</body>
</html>
